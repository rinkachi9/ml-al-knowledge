<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Vector addition on a GPU: one thread per element</title>
  <desc id="desc">Three columns of boxes labeled A, B and C. Each row is one element index, from i, i + 1 up to i + 5, then a gap, then i + n. A plus sign between columns A and B and an equals sign between B and C show that each row computes C[i] = A[i] + B[i]. On the right, the kernel VecAdd(A, B, C) sets int i = threadIdx and computes C[i] = A[i] + B[i], and is launched as VecAdd with n threads, so every row is handled by its own thread in parallel.</desc>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#212121">
    <text x="110" y="44">A</text>
    <text x="250" y="44">B</text>
    <text x="390" y="44">C</text>
  </g>
  <g stroke="#bdbdbd" stroke-width="2" stroke-dasharray="6 6">
    <line x1="80" y1="80" x2="470" y2="80"/>
    <line x1="80" y1="140" x2="470" y2="140"/>
    <line x1="80" y1="200" x2="470" y2="200"/>
    <line x1="80" y1="260" x2="470" y2="260"/>
    <line x1="80" y1="320" x2="470" y2="320"/>
    <line x1="80" y1="380" x2="470" y2="380"/>
    <line x1="80" y1="470" x2="470" y2="470"/>
  </g>
  <g>
    <rect x="85" y="60" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="60" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="60" width="50" height="40" rx="8" fill="#43a047"/>
    <rect x="85" y="120" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="120" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="120" width="50" height="40" rx="8" fill="#43a047"/>
    <rect x="85" y="180" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="180" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="180" width="50" height="40" rx="8" fill="#43a047"/>
    <rect x="85" y="240" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="240" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="240" width="50" height="40" rx="8" fill="#43a047"/>
    <rect x="85" y="300" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="300" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="300" width="50" height="40" rx="8" fill="#43a047"/>
    <rect x="85" y="360" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="360" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="360" width="50" height="40" rx="8" fill="#43a047"/>
    <rect x="85" y="450" width="50" height="40" rx="8" fill="#f9a825"/><rect x="225" y="450" width="50" height="40" rx="8" fill="#1e88e5"/><rect x="365" y="450" width="50" height="40" rx="8" fill="#43a047"/>
  </g>
  <g fill="#9e9e9e">
    <circle cx="110" cy="415" r="3"/><circle cx="110" cy="425" r="3"/><circle cx="110" cy="435" r="3"/>
    <circle cx="250" cy="415" r="3"/><circle cx="250" cy="425" r="3"/><circle cx="250" cy="435" r="3"/>
    <circle cx="390" cy="415" r="3"/><circle cx="390" cy="425" r="3"/><circle cx="390" cy="435" r="3"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1565c0">
    <circle cx="180" cy="260" r="18" fill="#e3f2fd"/><text x="180" y="268">+</text>
    <circle cx="320" cy="260" r="18" fill="#e3f2fd"/><text x="320" y="268">=</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#424242">
    <text x="490" y="86">i</text>
    <text x="490" y="146">i + 1</text>
    <text x="490" y="206">i + 2</text>
    <text x="490" y="266">i + 3</text>
    <text x="490" y="326">i + 4</text>
    <text x="490" y="386">i + 5</text>
    <text x="490" y="476">i + n</text>
  </g>
  <rect x="580" y="150" width="360" height="220" rx="10" fill="#f5f5f5" stroke="#9e9e9e"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#212121">
    <text x="600" y="190">VecAdd(A, B, C)</text>
    <text x="600" y="218">{</text>
    <text x="620" y="246">int i = threadIdx;</text>
    <text x="620" y="274">C[i] = A[i] + B[i];</text>
    <text x="600" y="302">}</text>
    <text x="600" y="344">VecAdd&lt;&lt;&lt;1, n&gt;&gt;&gt;(A, B, C)</text>
  </g>
  <text x="760" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#616161" text-anchor="middle">one thread per row, all rows in parallel</text>
</svg>
